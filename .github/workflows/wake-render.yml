# ปลุก Render (แพ็กเกจฟรีหลับเมื่อว่าง 15 นาที) ให้ worker ส่งคำตอบที่ค้างในคิวขึ้น Google Sheets
# ฟอร์มลูกค้าบันทึกผ่าน Vercel Functions จึงไม่ต้องรอ Render — แถวในชีทจะช้าได้สูงสุดประมาณรอบของ cron นี้
# หมายเหตุ: GitHub ปิด schedule เองถ้า repo ไม่มี commit 60 วัน (เปิดกลับได้ที่แท็บ Actions) · ถ้าใช้ Render Starter ลบไฟล์นี้ได้
name: wake-render

on:
  schedule:
    - cron: "*/30 * * * *" # ทุก 30 นาที (GitHub อาจเลื่อนไปบ้าง)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz (รอ Render ตื่นได้ถึง 3 นาที)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 180 https://customer-review-9s49.onrender.com/healthz
