# MySQL 8 สำหรับพัฒนาในเครื่องเท่านั้น (production ใช้ TiDB Cloud ซึ่งเข้ากันได้กับ MySQL)
# รหัสผ่านด้านล่างเป็นค่าสำหรับ dev ในเครื่องเท่านั้น ห้ามนำไปใช้ที่อื่น
services:
  mysql:
    image: mysql:8.4
    container_name: review-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${DB_NAME:-customer_review}
      MYSQL_USER: ${DB_USER:-review}
      MYSQL_PASSWORD: ${DB_PASSWORD:-review_dev_pw}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_dev_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
